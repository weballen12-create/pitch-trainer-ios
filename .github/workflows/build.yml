name: Build iPhone app (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iPhone (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project PitchTest.xcodeproj -scheme PitchTest             -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             build 2>&1 | tee build.log | tail -n 40

      - name: Show compile errors as annotations
        if: failure()
        run: |
          grep -E "error:|fatal error|Undefined symbols|ld: " build.log | sort -u | head -12 | while IFS= read -r l; do echo "::error::${l:0:480}"; done || true

      - name: Package as an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PitchTest.app Payload/
          zip -qr PitchTest.ipa Payload
          ls -l PitchTest.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PitchTest-unsigned-ipa
          path: PitchTest.ipa
