name: Build iPhone app (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build for iPhone (no code signing)
        run: |
          xcodebuild -project PitchTest.xcodeproj -scheme PitchTest \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60

      - name: Package as an .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PitchTest.app Payload/
          zip -qr PitchTest.ipa Payload
          ls -l PitchTest.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: PitchTest-unsigned-ipa
          path: PitchTest.ipa
